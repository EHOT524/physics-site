<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физика — кабинет репетитора</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">⚛ Физика <span id="brandSub"></span></div>
  <div id="modes" class="modes" title="Класс или экзамен"></div>
  <nav id="nav">
    <button data-view="theory">Теория</button>
    <button data-view="tasks">Задачи</button>
    <button data-view="variant">Вариант / ДЗ</button>
    <button data-view="mine">Мои задачи</button>
    <button data-view="students">Ученики</button>
    <button data-view="ref">Справка</button>
  </nav>
  <div class="links">
    <a href="https://app.dotspace.ru/dashboard" target="_blank" rel="noopener">Dotspace ↗</a>
    <a href="https://ege.fipi.ru/bank/" target="_blank" rel="noopener">Банк ФИПИ ↗</a>
    <button id="themeBtn" title="Светлая/тёмная тема">◐</button>
  </div>
</header>

<main id="app"></main>

<!-- Режим урока: полноэкранный показ задачи для демонстрации экрана в Dotspace -->
<div id="board" class="board hidden">
  <div class="board-bar">
    <button id="bBack" class="primary" title="Вернуться к списку (Esc)">← Выйти с доски</button>
    <button id="bPrev">← Пред.</button>
    <span id="bInfo"></span>
    <button id="bNext">След. →</button>
    <span class="spacer"></span>
    <button id="bFontMinus">A−</button>
    <button id="bFontPlus">A+</button>
    <button id="bStep">Показать шаг решения</button>
    <button id="bAll">Всё решение</button>
    <button id="bClose">✕ Закрыть</button>
  </div>
  <div id="bBody" class="board-body"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="theory.js"></script>
<script src="tasks.js"></script>
<script src="grade7.js"></script>
<script src="grade8.js"></script>
<script src="grade9.js"></script>
<script src="extra79.js"></script>
<script src="grade10-11.js"></script>
<script src="oge.js"></script>
<script src="modes.js"></script>
<script src="app.js"></script>
</body>
</html>
